<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>safe_video1 — ROI 설정</title>
<style>
  :root {
    --zone: #FFCC00;          /* vunexai ROI_ZONE_COLOR */
    --zone-hl: #FEDB25;       /* HIGHLIGHT_COLOR */
    --det: #3DDC97;           /* 검출 박스 */
    --alert: #FF5A5A;         /* ROI에 걸린 상태 */
    --bg: #171719; --panel: #1f1f22; --fill: #2a2a2e; --fill-strong: #37373d;
    --label: #e8e8ea; --label-dim: #9a9aa0; --line: #333338;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; gap: 16px; padding: 16px;
         background: var(--bg); color: var(--label);
         font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }

  #stage { position: relative; flex: 1; display: grid; place-items: center;
           min-width: 0; }
  #frame { position: relative; line-height: 0; }
  #v { max-width: 100%; max-height: calc(100vh - 32px); display: block; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }

  aside { width: 300px; flex: none; display: flex; flex-direction: column; gap: 10px;
          background: var(--panel); border-radius: 10px; padding: 12px; }
  header { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 15px; margin: 0; flex: 1; }
  #count { color: var(--label-dim); font-size: 12px; }

  button { border: 0; border-radius: 6px; background: var(--fill); color: var(--label);
           padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { background: var(--fill-strong); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.icon { padding: 4px 7px; background: none; color: var(--label-dim); }
  button.icon:hover { background: var(--fill); color: var(--label); }

  #list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
          border-radius: 8px; cursor: pointer; }
  .item:hover { background: var(--fill); }
  .item.sel { background: var(--fill-strong); }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  .item.off .name { color: var(--label-dim); }
  .item .pts { color: var(--label-dim); font-size: 11px; }
  .item input { flex: 1; min-width: 0; background: var(--bg); color: var(--label);
                border: 1px solid var(--zone); border-radius: 4px; padding: 3px 6px;
                font: inherit; }
  .sw { width: 30px; height: 17px; flex: none; border-radius: 9px;
        background: var(--fill-strong); position: relative; transition: background .15s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px;
               height: 13px; border-radius: 50%; background: #86868c;
               transition: transform .15s, background .15s; }
  .item:not(.off) .sw { background: var(--zone); }
  .item:not(.off) .sw::after { transform: translateX(13px); background: #17171a; }

  #done { background: var(--zone); color: #17171a; font-weight: 600; }
  #done:hover { background: var(--zone-hl); }
  #empty { color: var(--label-dim); font-size: 13px; text-align: center; padding: 20px 0; }

  .item .hit { flex: none; font-size: 11px; font-weight: 600; padding: 1px 6px;
               border-radius: 8px; background: var(--alert); color: #17171a; }
  #status { border-top: 1px solid var(--line); padding-top: 10px;
            display: flex; flex-wrap: wrap; gap: 4px 12px;
            color: var(--label-dim); font-size: 11px; }
  #status b { color: var(--label); font-weight: 600; }
  #events { max-height: 128px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 3px; }
  #events div { font-size: 11px; color: var(--label-dim); }
  #events b { color: var(--alert); font-weight: 600; }
  h2 { font-size: 12px; margin: 0; color: var(--label-dim); font-weight: 600; }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <img id="v" alt="MJPEG stream">
    <canvas id="cv"></canvas>
  </div>
</div>

<aside>
  <header>
    <h1 id="title">검출 영역</h1>
    <span id="count"></span>
    <button id="add">+ 추가</button>
    <button id="done" hidden>완료</button>
  </header>
  <div id="list"></div>
  <h2>이벤트</h2>
  <div id="events"></div>
  <div id="status"></div>
</aside>

<script>
const HIT = 7;                      // 꼭짓점 클릭 판정 반경(px)
const img = document.getElementById('v');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $list = document.getElementById('list');

let rois = [], max = 10;
let dets = [], roiHits = {};   // 서버 추론 결과 (폴링)
let selId = null;      // 편집 중인 ROI
let draftId = null;    // 방금 추가해서 아직 영역을 다 그리지 않은 ROI
let hoverId = null;    // 마우스가 올라간 ROI
let drag = null;       // {roiId, index} — 꼭짓점 드래그 중
let renaming = null;   // 이름 편집 중인 ROI id

const byId = id => rois.find(r => r.id === id);
const api = (method, path, body) =>
  fetch(path, {method, headers: {'Content-Type': 'application/json'},
               body: body && JSON.stringify(body)}).then(r => r.json());

// ---------------------------------------------------------------- 좌표 변환
// 저장은 0~1 정규화, 그리기는 캔버스 픽셀. 영상 크기가 바뀌어도 ROI는 그대로다.
const toPx = p => ({x: p.x * cv.clientWidth, y: p.y * cv.clientHeight});
const toNorm = (px, py) => ({
  x: Math.min(Math.max(px / cv.clientWidth, 0), 1),
  y: Math.min(Math.max(py / cv.clientHeight, 0), 1),
});
const mouseAt = e => {
  const b = cv.getBoundingClientRect();
  return {px: e.clientX - b.left, py: e.clientY - b.top};
};

// vunexai canvas.ts 의 isPointInPolygon 과 동일한 ray casting
function inPolygon(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const {x: xi, y: yi} = pts[i], {x: xj, y: yj} = pts[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi)
      inside = !inside;
  }
  return inside;
}

// ---------------------------------------------------------------- 그리기
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr;
  cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  drawDetections();
  for (const roi of rois) {
    const sel = roi.id === selId, hl = roi.id === hoverId;
    const hit = roiHits[roi.id] > 0;
    const pts = roi.points.map(toPx);
    if (!pts.length) continue;

    ctx.globalAlpha = roi.enabled ? 1 : 0.45;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    if (pts.length > 2) {
      ctx.closePath();
      ctx.fillStyle = hit ? 'rgba(255,90,90,.22)'
                    : hl  ? 'rgba(254,219,37,.32)' : 'rgba(255,204,0,.08)';
      ctx.fill();
    }
    ctx.strokeStyle = hit ? '#FF5A5A' : (sel || hl ? '#FEDB25' : '#FFCC00');
    ctx.lineWidth = sel || hit ? 2 : 1;
    ctx.stroke();

    if (sel) {   // 편집 중일 때만 꼭짓점 핸들 표시
      pts.forEach((p, i) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, i === 0 ? 6 : 5, 0, Math.PI * 2);
        ctx.fillStyle = i === 0 ? '#FEDB25' : '#17171a';
        ctx.strokeStyle = '#FEDB25';
        ctx.lineWidth = 2;
        ctx.fill(); ctx.stroke();
      });
    } else if (pts.length > 2) {
      label(roi.name, pts[0]);
    }
    ctx.globalAlpha = 1;
  }
}

function drawDetections() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.font = '11px system-ui, sans-serif';
  ctx.lineWidth = 2;
  for (const d of dets) {
    const [x1, y1, x2, y2] = d.box;
    const px = x1 * W, py = y1 * H, pw = (x2 - x1) * W, ph = (y2 - y1) * H;
    const inRoi = d.roi_ids && d.roi_ids.length;
    ctx.strokeStyle = inRoi ? '#FF5A5A' : '#3DDC97';
    ctx.strokeRect(px, py, pw, ph);

    const text = `${d.name} ${(d.conf * 100).toFixed(0)}%`;
    const tw = ctx.measureText(text).width + 8;
    ctx.fillStyle = inRoi ? '#FF5A5A' : '#3DDC97';
    ctx.fillRect(px, Math.max(py - 15, 0), tw, 14);
    ctx.fillStyle = '#17171a';
    ctx.fillText(text, px + 4, Math.max(py - 15, 0) + 10.5);
  }
}

function label(text, at) {
  ctx.font = '11px system-ui, sans-serif';
  const w = ctx.measureText(text).width + 10;
  const x = Math.min(at.x, cv.clientWidth - w), y = Math.max(at.y - 18, 0);
  ctx.fillStyle = '#FFCC00';
  ctx.fillRect(x, y, w, 16);
  ctx.fillStyle = '#000';
  ctx.fillText(text, x + 5, y + 11.5);
}

// ---------------------------------------------------------------- 목록 UI
function render() {
  const editing = byId(selId);
  const drafting = editing && editing.id === draftId;
  document.getElementById('title').textContent = editing ? '영역 그리기' : '검출 영역';
  document.getElementById('count').textContent =
    editing ? `${editing.points.length}점` : `${rois.length}/${max}`;
  document.getElementById('add').hidden = !!editing;
  document.getElementById('add').disabled = rois.length >= max;

  const $done = document.getElementById('done');
  $done.hidden = !editing;
  // 꼭짓점이 3개 미만이면 영역이 아니다. 새로 만들던 중이면 취소로 동작한다.
  $done.textContent = drafting && editing.points.length < 3 ? '취소' : '완료';

  $list.innerHTML = '';

  if (!rois.length) {
    $list.innerHTML = '<div id="empty">추가 버튼으로 검출 영역을 만드세요</div>';
  }

  for (const roi of rois) {
    const el = document.createElement('div');
    el.className = 'item' + (roi.id === selId ? ' sel' : '') +
                   (roi.enabled ? '' : ' off');
    el.onclick = () => roi.id === selId ? finish() : select(roi.id);
    el.onmouseenter = () => { hoverId = roi.id; draw(); };
    el.onmouseleave = () => { hoverId = null; draw(); };

    const sw = document.createElement('div');
    sw.className = 'sw';
    sw.title = roi.enabled ? '사용 중' : '사용 안 함';
    sw.onclick = e => { e.stopPropagation(); save(roi.id, {enabled: !roi.enabled}); };
    el.append(sw);

    if (renaming === roi.id) {
      const input = document.createElement('input');
      input.value = roi.name;
      input.maxLength = 50;
      input.onclick = e => e.stopPropagation();
      // Enter와 포커스 아웃 양쪽에서 호출되므로 renaming으로 중복 저장을 막는다.
      const commit = () => {
        if (renaming !== roi.id) return;
        const name = input.value.trim();
        renaming = null;
        name && name !== roi.name ? save(roi.id, {name}) : render();
      };
      input.onkeydown = e => {
        e.stopPropagation();
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') { renaming = null; render(); }
      };
      input.onblur = commit;
      el.append(input);
      setTimeout(() => { input.focus(); input.select(); });
    } else {
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = roi.name;
      name.title = roi.name;
      name.ondblclick = e => { e.stopPropagation(); renaming = roi.id; render(); };
      const pts = document.createElement('span');
      pts.className = 'pts';
      pts.textContent = `${roi.points.length}점`;
      el.append(name, pts);
    }

    if (roiHits[roi.id] > 0) {
      const hit = document.createElement('span');
      hit.className = 'hit';
      hit.textContent = roiHits[roi.id];
      hit.title = '이 영역에서 검출된 개수';
      el.append(hit);
    }

    const rename = document.createElement('button');
    rename.className = 'icon'; rename.textContent = '✎'; rename.title = '이름 변경';
    rename.onclick = e => { e.stopPropagation(); renaming = roi.id; render(); };

    const del = document.createElement('button');
    del.className = 'icon'; del.textContent = '🗑'; del.title = '삭제';
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`'${roi.name}' 영역을 삭제할까요?`)) return;
      await fetch(`/api/rois/${roi.id}`, {method: 'DELETE'});
      if (selId === roi.id) selId = null;
      reload();
    };
    el.append(rename, del);
    $list.append(el);
  }
}

function select(id) { selId = id; renaming = null; render(); draw(); }

/** 편집 종료. 만들다 만 영역(꼭짓점 3개 미만)은 남기지 않고 지운다. */
async function finish() {
  const roi = byId(selId);
  selId = null;
  if (roi && roi.id === draftId && roi.points.length < 3) {
    draftId = null;
    await fetch(`/api/rois/${roi.id}`, {method: 'DELETE'});
    return reload();
  }
  draftId = null;
  render(); draw();
}

// ---------------------------------------------------------------- 서버 반영
async function reload() {
  const data = await fetch('/api/rois').then(r => r.json());
  rois = data.rois; max = data.max;
  render(); draw();
}

// 변경은 그때그때 PUT으로 저장한다 (별도 '적용' 단계 없음).
async function save(id, patch) {
  const updated = await api('PUT', `/api/rois/${id}`, patch);
  const i = rois.findIndex(r => r.id === id);
  if (i >= 0 && updated.id) rois[i] = updated;
  render(); draw();
}

document.getElementById('add').onclick = async () => {
  const res = await api('POST', '/api/rois', {name: `New Zone ${rois.length + 1}`});
  if (res.error) return alert(res.error);
  await reload();
  draftId = res.id;
  select(res.id);          // 바로 편집 모드로 — 클릭해서 꼭짓점을 찍는다
};

document.getElementById('done').onclick = finish;

// ---------------------------------------------------------------- 캔버스 조작
function vertexAt(px, py) {
  const roi = byId(selId);
  if (!roi) return -1;
  return roi.points.findIndex(p => {
    const q = toPx(p);
    return Math.hypot(q.x - px, q.y - py) <= HIT;
  });
}

cv.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const {px, py} = mouseAt(e);
  const roi = byId(selId);

  if (roi) {
    const vi = vertexAt(px, py);
    if (vi >= 0) {                       // 기존 꼭짓점 잡고 이동
      drag = {index: vi};
      cv.setPointerCapture(e.pointerId);
      return;
    }
    if (roi.points.length < 30) {        // 빈 곳 클릭 -> 꼭짓점 추가
      roi.points.push(toNorm(px, py));
      render(); draw();                 // 저장을 기다리지 않고 즉시 반영
      save(roi.id, {points: roi.points});
      return;
    }
  }
  // 편집 중이 아니면 폴리곤 안쪽을 클릭해 선택
  const n = toNorm(px, py);
  const hit = [...rois].reverse()
    .find(r => r.points.length > 2 && inPolygon(n.x, n.y, r.points));
  select(hit ? hit.id : null);
});

cv.addEventListener('pointermove', e => {
  const {px, py} = mouseAt(e);
  const n = toNorm(px, py);

  if (drag) {
    const roi = byId(selId);
    roi.points[drag.index] = n;
    draw();
    return;
  }
  // 목록 <-> 영상 하이라이트 연동
  const hit = rois.find(r => r.points.length > 2 && inPolygon(n.x, n.y, r.points));
  const id = hit ? hit.id : null;
  if (id !== hoverId) { hoverId = id; render(); draw(); }
  cv.style.cursor = selId ? (vertexAt(px, py) >= 0 ? 'move' : 'crosshair')
                          : (hit ? 'pointer' : 'default');
});

cv.addEventListener('pointerup', () => {
  if (!drag) return;
  const roi = byId(selId);
  drag = null;
  save(roi.id, {points: roi.points});   // 드래그가 끝날 때 한 번만 저장
});

cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  const roi = byId(selId);
  if (!roi) return;
  const {px, py} = mouseAt(e);
  const vi = vertexAt(px, py);
  if (vi < 0) return;
  roi.points.splice(vi, 1);             // 우클릭으로 꼭짓점 삭제
  save(roi.id, {points: roi.points});
});

document.addEventListener('keydown', e => {
  if (renaming !== null) return;
  if (e.key === 'Escape' || e.key === 'Enter') finish();
});

// ---------------------------------------------------------------- 추론 결과 폴링
// 검출 결과는 서버가 별도 스레드에서 만들고, 화면은 캔버스에 겹쳐 그리기만 한다.
// MJPEG 스트림 자체에는 손대지 않으므로 송출 FPS와 추론 FPS가 서로 독립적이다.
let cfg = {};

async function poll() {
  try {
    const d = await (await fetch('/api/detections')).json();
    const hitsChanged = JSON.stringify(d.roi_hits) !== JSON.stringify(roiHits);
    dets = d.detections;
    roiHits = d.roi_hits;
    if (hitsChanged) render();          // 목록의 검출 배지 갱신
    draw();
    showStatus(d);
  } catch { /* 서버 재시작 중 — 다음 주기에 다시 시도 */ }
}

function showStatus(d) {
  const el = document.getElementById('status');
  el.innerHTML =
      `<span>송출 <b>${d.fps ?? '-'}</b> fps</span>`
    + `<span>추론 <b>${d.ai_fps ?? '-'}</b> fps</span>`
    + `<span>지연 <b>${d.infer_ms ?? '-'}</b> ms</span>`
    + `<span>검출 <b>${dets.length}</b></span>`
    + (cfg.model ? `<span>${cfg.source} · ${cfg.model}</span>` : '');
}

async function pollEvents() {
  try {
    const {events} = await (await fetch('/api/events')).json();
    const el = document.getElementById('events');
    el.innerHTML = events.length
      ? events.map(e => `<div>${e.ts} <b>${e.roi_name}</b> 진입 (${e.count})</div>`).join('')
      : '<div>아직 이벤트 없음</div>';
  } catch { /* 무시 */ }
}

// ---------------------------------------------------------------- 시작
new ResizeObserver(resize).observe(img);
img.onload = resize;
img.src = '/stream.mjpg?t=' + Date.now();
reload();
fetch('/api/status').then(r => r.json()).then(s => { cfg = s; });
setInterval(poll, 200);
setInterval(pollEvents, 1000);
</script>
</body>
</html>
